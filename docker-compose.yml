services:
  mongo:
    image: mongo:7
    # Caché de WiredTiger acotada: por defecto usa ~50% de la RAM y, junto
    # con los ~5 GB que ocupa el cargador, en una máquina de 16 GB la
    # escritura concurrente se trababa (desalojo de caché atascado).
    command: ["--wiredTigerCacheSizeGB", "2"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mongo_data:
